name: Local operations console
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-web-test.txt
      - run: python -W error::ResourceWarning -m unittest discover -s contract_to_cash/tests -v
      - run: python -W error::ResourceWarning -m unittest discover -s tests_web -v
      - run: python -W error::ResourceWarning -m unittest discover -s tests_launcher -v
      - run: python -m scripts.export_web_schema --check
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test
      - run: python -m playwright install chromium --only-shell
      - run: python -m scripts.smoke_web
